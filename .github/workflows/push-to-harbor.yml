name: Push Docker Image to Harbor

on:
  push:
    branches:
      - main  # Triggers the workflow when code is pushed to the main branch

permissions:
  contents: read

env:
  HARBOR_REGISTRY: amr-registry-pre.caas.intel.com       # Replace with your Harbor URL
  HARBOR_PROJECT: if-pdh-ai-assist           # Replace with your Harbor project name
  IMAGE_NAME: ifsp-webapp                    # Replace with your desired image name

jobs:
  build-and-push:
    runs-on: [self-hosted, linux, x64]
    env:
      HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
      HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate Harbor credentials
        run: |
          if [ -z "${HARBOR_USERNAME}" ] || [ -z "${HARBOR_PASSWORD}" ]; then
            echo "HARBOR_USERNAME and HARBOR_PASSWORD repository secrets must be configured for the build-and-push workflow."
            exit 1
          fi

      - name: Log in to Harbor
        run: |
          echo "${HARBOR_PASSWORD}" | docker login "${{ env.HARBOR_REGISTRY }}" --username "${HARBOR_USERNAME}" --password-stdin

      - name: Build and push Docker image
        run: |
          docker build -f webapp/Dockerfile -t "${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/${{ env.IMAGE_NAME }}:latest" -t "${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/${{ env.IMAGE_NAME }}:${{ github.sha }}" .
          docker push "${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/${{ env.IMAGE_NAME }}:latest"
          docker push "${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"