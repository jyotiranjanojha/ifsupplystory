version: '3.9'

services:
  ifspstory:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ifspstory
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      SEMANTIC_MODE: legacy
    restart: unless-stopped
    # The Python backend remains internal to the container and is accessed by the Node app,
    # not published to the host network.
